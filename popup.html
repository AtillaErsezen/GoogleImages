<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 220px;
            padding: 15px;
            font-family: sans-serif;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        input[type="text"] {
            width: 100%;
            padding: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .toggle-row input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            color: green;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="toggle-row">
        <input type="checkbox" id="isActive">
        <label style="margin: 0;">Enable Downloader</label>
    </div>

    <label>Download Subfolder:</label>
    <input type="text" id="folderName" placeholder="Leave blank for Auto-Folder">
    <p style="font-size: 11px; color: #666;">If blank, we'll use your Google Search query as the folder name.</p>

    <label>Custom Filename:</label>
    <input type="text" id="fileName" placeholder="Leave blank for Auto-Name">
    <p style="font-size: 11px; color: #666; margin-top: -10px;">If blank, we use the Search Query + Timestamp.</p>

    <button id="saveBtn">Save Settings</button>
    <div id="status">Saved successfully!</div>

    <script src="popup.js"></script>
</body>

</html>
